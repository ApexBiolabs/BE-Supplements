<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Account — Be Elite Supplements</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="icon" href="/img/favicon.png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#ffffff;--navy2:#f6f7f9;--navy3:#f2f4f6;
  --green:#8C6A1E;--green2:#6E5418;--green-l:#8C6A1E;--green-xl:#6E5418;--gold:#8C6A1E;--red:#B42318;
  --gbg:rgba(140,106,30,0.07);--gborder:rgba(140,106,30,0.32);
  --text:#0E1116;--text2:#3D4450;--muted:#5B6370;
  --border:#E4E7EB;--border2:#D5D9DF;
  --s1:rgba(14,17,22,0.025);--s2:rgba(14,17,22,0.05);
  --danger:#B42318;--warn:#B45309;--info:#1D4ED8;
}
body{background:var(--navy);color:var(--text);font-family:'IBM Plex Sans',sans-serif;min-height:100vh}
a{color:inherit}

/* HEADER */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem;border-bottom:1px solid var(--border)}
.brand{font-family:'IBM Plex Sans',sans-serif;font-size:1.3rem;letter-spacing:0.06em;color:var(--green-l);text-decoration:none}
.back-link{font-size:0.85rem;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}

/* AUTH SCREEN */
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 70px);padding:2rem}
.auth-box{background:var(--navy2);border:1px solid var(--border2);border-radius:14px;padding:2.25rem;width:100%;max-width:400px}
.auth-title{font-family:'IBM Plex Sans',sans-serif;font-size:1.8rem;letter-spacing:0.04em;margin-bottom:0.3rem;text-align:center}
.auth-sub{color:var(--muted);font-size:0.85rem;text-align:center;margin-bottom:1.75rem}
.auth-tabs{display:flex;gap:4px;background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:4px;margin-bottom:1.5rem}
.auth-tab{flex:1;padding:9px;border-radius:6px;border:none;background:none;color:var(--muted);font-weight:700;font-size:0.85rem;cursor:pointer;font-family:'IBM Plex Sans',sans-serif}
.auth-tab.active{background:var(--green);color:#fff}
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.8rem;font-weight:600;color:var(--text2);margin-bottom:0.4rem}
.field input{width:100%;padding:11px 12px;background:var(--s1);border:1px solid var(--border);color:var(--text);border-radius:7px;font-size:0.92rem;font-family:inherit}
.field input:focus{outline:none;border-color:var(--green)}
.auth-btn{width:100%;background:var(--green);color:#fff;border:none;padding:13px;border-radius:8px;font-weight:700;font-size:0.92rem;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;margin-top:0.4rem;transition:background .15s}
.auth-btn:hover{background:var(--green2)}
.auth-btn:disabled{opacity:0.6;cursor:not-allowed}
.auth-msg{font-size:0.82rem;text-align:center;margin-top:0.9rem;min-height:1.1em}
.auth-msg.error{color:var(--danger)}
.auth-msg.ok{color:var(--green-l)}

/* DASHBOARD */
.dash{display:none;max-width:780px;margin:0 auto;padding:2rem 1.5rem 4rem}
.dash.show{display:block}
.dash-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
.dash-hi{font-family:'IBM Plex Sans',sans-serif;font-size:1.9rem;letter-spacing:0.03em}
.dash-email{color:var(--muted);font-size:0.85rem;margin-top:2px}
.logout-btn{background:none;border:1px solid var(--border2);color:var(--muted);padding:9px 18px;border-radius:7px;cursor:pointer;font-size:0.82rem;font-family:'IBM Plex Sans',sans-serif}
.logout-btn:hover{border-color:var(--danger);color:var(--danger)}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.9rem;margin-bottom:2rem}
.stat-card{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:1.1rem}
.stat-label{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.35rem}
.stat-val{font-family:'IBM Plex Sans',sans-serif;font-size:1.5rem;color:var(--green-l)}

.section-title{font-size:1.05rem;font-weight:700;margin-bottom:0.9rem}
.orders-wrap{background:var(--navy2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:2rem}
.order-row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);gap:1rem;flex-wrap:wrap}
.order-row:last-child{border-bottom:none}
.order-ref{font-weight:700;font-size:0.9rem}
.order-items{color:var(--muted);font-size:0.78rem;margin-top:2px}
.order-right{display:flex;align-items:center;gap:14px}
.order-amt{font-weight:700;color:var(--green-l);font-size:0.92rem}
.badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
.badge-pending{background:rgba(245,158,11,0.15);color:var(--warn);border:1px solid rgba(245,158,11,0.3)}
.badge-paid{background:rgba(140,106,30,0.15);color:var(--green-l);border:1px solid rgba(140,106,30,0.3)}
.badge-dispatched{background:rgba(37,99,235,0.12);color:#1d4ed8;border:1px solid rgba(96,165,250,0.3)}
.badge-cancelled{background:rgba(224,82,82,0.15);color:var(--danger);border:1px solid rgba(224,82,82,0.3)}
.empty-orders{text-align:center;padding:2.5rem;color:var(--muted);font-size:0.88rem}

.profile-box{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:1.4rem}
.profile-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:0.88rem}
.profile-row:last-child{border-bottom:none}
.profile-label{color:var(--muted)}

.reminder-box{background:var(--navy2);border:1px solid var(--border);border-radius:10px;padding:1.4rem;margin-bottom:2rem}
.reminder-form{display:flex;gap:0.7rem;margin-bottom:1.1rem;flex-wrap:wrap}
.reminder-form input[type="date"]{padding:10px 12px;background:var(--s1);border:1px solid var(--border);color:var(--text);border-radius:7px;font-size:0.88rem;font-family:inherit}
.reminder-form input[type="text"]{flex:1;min-width:160px;padding:10px 12px;background:var(--s1);border:1px solid var(--border);color:var(--text);border-radius:7px;font-size:0.88rem;font-family:inherit}
.reminder-form input:focus{outline:none;border-color:var(--green)}
.reminder-add-btn{background:var(--green);color:#fff;border:none;padding:10px 18px;border-radius:7px;font-weight:700;font-size:0.85rem;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;white-space:nowrap}
.reminder-add-btn:hover{background:var(--green2)}
.reminder-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:1rem}
.reminder-row:last-child{border-bottom:none}
.reminder-date{font-weight:700;font-size:0.85rem;color:var(--green-l);white-space:nowrap;min-width:90px}
.reminder-note{color:var(--text2);font-size:0.88rem;flex:1}
.reminder-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px;line-height:1}
.reminder-del:hover{color:var(--danger)}
.reminder-empty{color:var(--muted);font-size:0.85rem;text-align:center;padding:1rem 0}

.loading{text-align:center;padding:3rem;color:var(--muted)}
.spinner{border:3px solid rgba(13,27,46,0.1);border-top:3px solid var(--green);border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .topbar{padding:0.9rem 1.2rem}
  .stat-row{grid-template-columns:1fr 1fr}
  .stat-row .stat-card:last-child{grid-column:1/-1}
  .order-row{flex-direction:column;align-items:flex-start}
  .order-right{width:100%;justify-content:space-between}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="/"><img src="/img/logo.png" alt="Be Elite Supplements" style="height:34px;display:block"/></a>
  <a class="back-link" href="/">← Back to shop</a>
</div>

<!-- AUTH SCREEN -->
<div class="auth-wrap" id="authWrap">
  <div class="auth-box">
    <div class="auth-title">My Account</div>
    <div class="auth-sub">Sign in to view your orders</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin" onclick="setMode('login')">Sign In</button>
      <button class="auth-tab" id="tabSignup" onclick="setMode('signup')">Create Account</button>
    </div>

    <div class="field" id="nameField" style="display:none">
      <label>Full Name</label>
      <input type="text" id="nameInput" placeholder="Jane Smith"/>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="you@email.com"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="passInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitAuth()"/>
    </div>

    <button class="auth-btn" id="authBtn" onclick="submitAuth()">Sign In</button>
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dash">
  <div class="dash-head">
    <div>
      <div class="dash-hi" id="dashHi">Welcome back</div>
      <div class="dash-email" id="dashEmail"></div>
    </div>
    <button class="logout-btn" onclick="logout()">Log Out</button>
  </div>

  <div class="stat-row">
    <div class="stat-card">
      <div class="stat-label">Total Orders</div>
      <div class="stat-val" id="statOrders">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Spent</div>
      <div class="stat-val" id="statSpent">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Last Order</div>
      <div class="stat-val" id="statLast" style="font-size:1.1rem">—</div>
    </div>
  </div>

  <div class="section-title">Order History</div>
  <div class="orders-wrap" id="ordersWrap">
    <div class="loading"><div class="spinner"></div>Loading your orders...</div>
  </div>

  <div class="section-title">Reminders</div>
  <div class="reminder-box">
    <div class="reminder-form">
      <input type="date" id="remDate"/>
      <input type="text" id="remNote" placeholder="e.g. Reorder reminder, delivery follow-up..."/>
      <button class="reminder-add-btn" onclick="addReminder()">Add Reminder</button>
    </div>
    <div id="remindersWrap"><div class="reminder-empty">Loading...</div></div>
  </div>

  <div class="section-title">Profile</div>
  <div class="profile-box">
    <div class="profile-row"><span class="profile-label">Name</span><span id="profName">—</span></div>
    <div class="profile-row"><span class="profile-label">Email</span><span id="profEmail">—</span></div>
    <div class="profile-row"><span class="profile-label">Member Since</span><span id="profSince">—</span></div>
  </div>
</div>

<script>
// ── CONFIG ──
// ⚠️ REPLACE THIS: Supabase → Settings → API → Project API keys → anon/public
const SUPABASE_URL = 'YOUR_SUPABASE_URL';        // e.g. https://abcdefgh.supabase.co
const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // the public "anon" key, safe to put here

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let mode = 'login';

function setMode(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabSignup').classList.toggle('active', m === 'signup');
  document.getElementById('nameField').style.display = m === 'signup' ? 'block' : 'none';
  document.getElementById('authBtn').textContent = m === 'signup' ? 'Create Account' : 'Sign In';
  document.getElementById('authMsg').textContent = '';
}

async function submitAuth() {
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  const name = document.getElementById('nameInput').value.trim();
  const msg = document.getElementById('authMsg');
  const btn = document.getElementById('authBtn');

  if (!email || !pass) { msg.textContent = 'Please enter your email and password.'; msg.className = 'auth-msg error'; return; }
  if (mode === 'signup' && !name) { msg.textContent = 'Please enter your name.'; msg.className = 'auth-msg error'; return; }
  if (pass.length < 6) { msg.textContent = 'Password must be at least 6 characters.'; msg.className = 'auth-msg error'; return; }

  btn.disabled = true;
  msg.textContent = '';

  if (mode === 'signup') {
    const { error } = await sb.auth.signUp({
      email, password: pass,
      options: { data: { full_name: name } }
    });
    if (error) {
      msg.textContent = error.message;
      msg.className = 'auth-msg error';
    } else {
      // Send our own branded welcome email via Resend (independent of Supabase's own mailer)
      try {
        const welcomeRes = await fetch('/api/welcome-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email }),
        });
        if (!welcomeRes.ok) {
          const errBody = await welcomeRes.text();
          console.error('Welcome email failed:', welcomeRes.status, errBody);
        }
      } catch (welcomeErr) {
        console.error('Welcome email request failed:', welcomeErr);
      }

      msg.textContent = 'Account created! You can sign in now.';
      msg.className = 'auth-msg ok';
      setMode('login');
    }
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) {
      msg.textContent = error.message;
      msg.className = 'auth-msg error';
    } else {
      await showDashboard();
    }
  }
  btn.disabled = false;
}

async function logout() {
  await sb.auth.signOut();
  document.getElementById('dash').classList.remove('show');
  document.getElementById('authWrap').style.display = 'flex';
  document.getElementById('emailInput').value = '';
  document.getElementById('passInput').value = '';
}

async function showDashboard() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  document.getElementById('authWrap').style.display = 'none';
  document.getElementById('dash').classList.add('show');

  const name = user.user_metadata?.full_name || user.email.split('@')[0];
  document.getElementById('dashHi').textContent = `Hi, ${name}`;
  document.getElementById('dashEmail').textContent = user.email;
  document.getElementById('profName').textContent = name;
  document.getElementById('profEmail').textContent = user.email;
  document.getElementById('profSince').textContent = new Date(user.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });

  await loadOrders(user.email);
  await loadReminders();

  const remDateEl = document.getElementById('remDate');
  if (remDateEl) remDateEl.value = new Date().toISOString().split('T')[0];
}

async function loadOrders(email) {
  const { data: orders, error } = await sb
    .from('orders')
    .select('ref, amount, items, status, created_at, tracking_number')
    .eq('customer_email', email)
    .in('status', ['paid', 'dispatched'])
    .order('created_at', { ascending: false });

  const wrap = document.getElementById('ordersWrap');

  if (error) {
    wrap.innerHTML = `<div class="empty-orders">Could not load orders right now.</div>`;
    return;
  }

  if (!orders || orders.length === 0) {
    wrap.innerHTML = `<div class="empty-orders">No orders yet — <a href="/" style="color:var(--green-l)">start shopping →</a></div>`;
    document.getElementById('statOrders').textContent = '0';
    document.getElementById('statSpent').textContent = '£0.00';
    document.getElementById('statLast').textContent = '—';
    return;
  }

  const totalSpent = orders.reduce((s, o) => s + parseFloat(o.amount || 0), 0);

  document.getElementById('statOrders').textContent = orders.length;
  document.getElementById('statSpent').textContent = '£' + totalSpent.toFixed(2);
  document.getElementById('statLast').textContent = new Date(orders[0].created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short' });

  wrap.innerHTML = orders.map(o => `
    <div class="order-row">
      <div>
        <div class="order-ref">${o.ref}</div>
        <div class="order-items">${o.items || '—'}${o.tracking_number ? ' · Tracking: ' + o.tracking_number : ''}</div>
      </div>
      <div class="order-right">
        <span class="badge badge-${o.status || 'pending'}">${o.status || 'pending'}</span>
        <span class="order-amt">£${parseFloat(o.amount || 0).toFixed(2)}</span>
      </div>
    </div>
  `).join('');
}

async function loadReminders() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  const { data: reminders, error } = await sb
    .from('reminders')
    .select('id, note, remind_date')
    .eq('user_id', user.id)
    .order('remind_date', { ascending: true });

  const wrap = document.getElementById('remindersWrap');
  if (!wrap) return;

  if (error) {
    wrap.innerHTML = '<div class="reminder-empty">Could not load reminders.</div>';
    return;
  }

  if (!reminders || reminders.length === 0) {
    wrap.innerHTML = '<div class="reminder-empty">No reminders yet — add one above.</div>';
    return;
  }

  wrap.innerHTML = reminders.map(r => `
    <div class="reminder-row">
      <span class="reminder-date">${new Date(r.remind_date).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })}</span>
      <span class="reminder-note">${r.note}</span>
      <button class="reminder-del" onclick="deleteReminder('${r.id}')" title="Delete">✕</button>
    </div>
  `).join('');
}

async function addReminder() {
  const dateEl = document.getElementById('remDate');
  const noteEl = document.getElementById('remNote');
  const date = dateEl.value;
  const note = noteEl.value.trim();

  if (!date || !note) return;

  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;

  const { error } = await sb.from('reminders').insert([{
    user_id: user.id,
    note,
    remind_date: date,
  }]);

  if (!error) {
    noteEl.value = '';
    await loadReminders();
  }
}

async function deleteReminder(id) {
  await sb.from('reminders').delete().eq('id', id);
  await loadReminders();
}

// Restore session on page load
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) await showDashboard();
})();
</script>
</body>
</html>
